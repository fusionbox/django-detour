[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "django-detour"
version = "0.0.11"
description = "Manages mass redirects. Very useful after a website redesign."
readme = "README.rst"
license = {text = "BSD"}
authors = [{name = "Fusionbox, Inc.", email = "programmers@fusionbox.com"}]
keywords = ["django", "redirect", "redirection", "mass", "massive", "redirects", "bulk", "csv"]
requires-python = ">=3.8"
dependencies = ["Django>=4.2"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/fusionbox/django-detour"

[tool.setuptools.packages.find]
include = ["django_detour*"]
